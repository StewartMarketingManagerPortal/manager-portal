name = "my-marketing"
main = "src/worker.js"
compatibility_date = "2026-06-01"
# keep variables and secrets set in the Cloudflare dashboard (MONDAY_TOKEN) when deploying
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# sign-in codes and rate limits live here (free on the Workers Free plan)
[[durable_objects.bindings]]
name = "GATE"
class_name = "Gate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Gate"]

[observability]
enabled = true
