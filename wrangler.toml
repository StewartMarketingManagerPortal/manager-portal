name = "manager-portal"
main = "src/worker.js"
compatibility_date = "2026-06-01"
# keep settings added in the Cloudflare dashboard when a new version is published
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[observability]
enabled = true

# every 5 minutes: reminders for social posts whose time has come (src/api.js socialReminders)
[triggers]
crons = ["*/5 * * * *"]
